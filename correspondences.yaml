# Cross-language concept correspondences for plurality-llm-wiki.
#
# Each entry asserts "these concepts are about the same/related topic" without
# claiming content equivalence (Wikipedia interlanguage-link metaphor). Null
# (~) means "no correspondence found in that language" — discoverable gaps.
#
# Add a new language by adding a column (e.g. `ko:` / `zh:`). The schema is
# intentionally flat to keep entries compact and easy to read.
#
# Tools:
#   python3 scripts/show_gaps.py    # list gaps and unmapped concept pages
#
# Maintenance: after ingest creates a new concept page, either add a row here
# (or extend an existing row with a sibling-language correspondence), or
# explicitly mark the other languages as ~ to record the gap.
#
# About the `zh-tw` column:
#   Added 2026-05-27 as an experimental annotation. The Plurality book is
#   originally bilingual en/zh (Traditional Chinese, i.e. zh-tw) so most book
#   concepts have zh-tw terms drawn from the Mandarin edition. Child wiki
#   `plurality-llm-wiki-zh-tw` exists on GitHub with seed pages (1 source +
#   1 concept). The column lets us test the hypothesis (from the
#   words-as-public-goods LT, 2024-01) that ja-zh-tw correspondences are
#   denser than en-ja via shared kanji. See analyses/kanji-as-ja-zh-bridge
#   (the analysis filename retains "zh" since kanji-bridging is a property of
#   the Chinese script family, not specifically Taiwan).

# ============================================================
# Core
# ============================================================

- en: Plurality
  ja: プルラリティ
  zh-tw: 多元
  notes: 本 wiki の eponymous concept。ja 訳語として「多元性」も使われるが、書籍ではカタカナ「プルラリティ」を採用。zh は 多元 / 多元宇宙 / 多元性 が併用される。

