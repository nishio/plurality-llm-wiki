# JA only (en: ~) — Suzuki Ken–derived lineage
# ============================================================

- en: Nameraka-Society
  ja: なめらかな社会とその敵
  zh-tw: ~
  notes: 鈴木健 (2013) の著書。Plurality 本日本語版で「双子の書籍」と位置づけられた。2024-12 に upstream EN manuscript の Section 3-3 "The Lost Dao" に「Quality Control and Nameraka Society」という 37 行の新規 sub-section として逆統合され (PR #1055)、EN wiki 側にも独立 concept ページが成立した。Wiener → Deming → JUSE → Toyota PDCA → Kauffman → 鈴木健 の系譜。zh-tw 側にはまだ dedicated ページなし。
- en: ~
  ja: 分人
  zh-tw: 分人
  notes: 平野啓一郎 / 鈴木健経由の概念。漢字「分人」は zh でも字面読解可能で kanji-bridge が成立する候補。Plurality 本日本語版 5-6 多元投票の脚注で関連が明示された。
- en: ~
  ja: 分人民主主義
  zh-tw: 分人民主主義
  notes: 分人を基礎にした民主主義思想。鈴木健由来で EN 本文に dedicated 概念がない。zh は字面で読解可能。
- en: ~
  ja: PICSY
  zh-tw: PICSY
  notes: 鈴木健の貨幣システム。Plurality 本日本語版で言及される。acronym なので zh でもそのまま使われる。

