# Cross-language concept correspondences for plurality-llm-wiki.
#
# Each entry asserts "these concepts are about the same/related topic" without
# claiming content equivalence (Wikipedia interlanguage-link metaphor). Null
# (~) means "no correspondence found in that language" — discoverable gaps.
#
# Add a new language by adding a column (e.g. `ko:` / `zh:`). The schema is
# intentionally flat to keep entries compact and easy to read.
#
# Tools:
#   python3 scripts/show_gaps.py    # list gaps and unmapped concept pages
#
# Maintenance: after ingest creates a new concept page, either add a row here
# (or extend an existing row with a sibling-language correspondence), or
# explicitly mark the other languages as ~ to record the gap.
#
# About the `zh-tw` column:
#   Added 2026-05-27. The Plurality book is originally bilingual en/zh (Traditional
#   Chinese, i.e. zh-tw) so most book concepts have zh-tw terms drawn from the
#   Mandarin edition. Child wiki `plurality-llm-wiki-zh-tw` populated to ~96 pages.
#   See analyses/kanji-as-ja-zh-bridge (the analysis filename retains "zh" since
#   kanji-bridging is a property of the Chinese script family, not specifically
#   Taiwan).
#
# About the `de` column:
#   Added 2026-05-28. The Plurality book's German edition (Pluralität, akinorioyama
#   release) is the source. Child wiki `plurality-llm-wiki-de` populated initially
#   to ~20 pages. Translation mappings reflect book-canonical German renderings
#   plus de subagent's translation observations (e.g. Datengewerkschaften activates
#   DGB / IG Metall tradition; ⿻ Öffentlichkeit Singular because Habermas tradition
#   blocks Plural; Pluralität follows the Latinisierung path like ja「プルラリティ」
#   and contrasts with zh-tw「多元」semantic path).

