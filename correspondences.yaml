- en: Quadratic-Voting
  ja: クアドラティック投票
  zh-tw: 平方投票
  notes: ja は katakana loanword (EN ベース)、zh は漢字翻訳 (平方=quadratic)。山形浩生訳は zh 経路 (平方投票) を採らず EN 経路を採った例。
